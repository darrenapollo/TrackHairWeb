<footer class="footer">
  <div class="container footer__shell">
    <div class="footer__brand">
      <p class="footer__title">Track Hair</p>
      <p class="footer__copy">{{ site.description }}</p>
    </div>

    <div class="footer__links">
      {% for link in site.data.strings.footer.links %}
      <a href="{{ link.url }}">{{ link.title }}</a>
      {% endfor %}
    </div>

    <p class="footer__legal">{{ site.data.strings.footer.copyright }}</p>
  </div>
</footer>

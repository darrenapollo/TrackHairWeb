<input type="checkbox" id="nav-toggle" class="nav__toggle" aria-hidden="true">
<nav class="nav" aria-label="Primary">
  <div class="nav__shell container">
    <a class="nav__brand" href="/" aria-label="Track Hair home">
      <img src="/assets/images/THAppIcon.png" alt="Track Hair icon" width="40" height="40">
      <span>Track Hair</span>
    </a>

    <div class="nav__desktop">
      {% for link in site.data.strings.nav.links %}
      <a class="nav__link{% if page.url == link.url %} nav__link--active{% endif %}" href="{{ link.url }}">{{ link.title }}</a>
      {% endfor %}
      <a class="button button--nav" href="{{ site.data.app.app_store_url }}" target="_blank" rel="noopener">{{ site.data.strings.nav.cta_label }}</a>
    </div>

    <label class="nav__menu-button" for="nav-toggle" aria-label="Open navigation">
      <span></span>
      <span></span>
      <span></span>
    </label>
  </div>

  <div class="nav__mobile">
    {% for link in site.data.strings.nav.links %}
    <a class="nav__mobile-link{% if page.url == link.url %} nav__mobile-link--active{% endif %}" href="{{ link.url }}">{{ link.title }}</a>
    {% endfor %}
    <a class="button button--mobile" href="{{ site.data.app.app_store_url }}" target="_blank" rel="noopener">{{ site.data.strings.nav.cta_label }}</a>
  </div>
</nav>

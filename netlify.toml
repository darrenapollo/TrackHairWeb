[build]
publish = "_site/"
command = "npm run build && cp -R assets _site/"

[build.environment]
RUBY_VERSION = "3.1.4"
NODE_VERSION = "14.18.0"
PYTHON = "python3.10"
SHARP_IGNORE_GLOBAL_LIBVIPS = "1"

# Notify participating search engines only after a production deploy succeeds.
[[context.production.plugins]]
package = "./plugins/indexnow"

  [context.production.plugins.inputs]
  host = "track.hair"
  key = "ec1cc71e359745789540fa5611ca5fd8"

# The AMP variants of the blog posts were removed. They were orphaned
# duplicates (no rel="amphtml" pairing) that the sitemap still advertised, and
# AMP no longer carries any ranking benefit. Redirect the old URLs to the
# canonical posts they already pointed at rather than serving 404s.
[[redirects]]
  from = "/amp/blog/finasteride-vs-dutasteride"
  to = "/blog/finasteride-vs-dutasteride/"
  status = 301
  force = true

[[redirects]]
  from = "/amp/blog/finasteride-vs-dutasteride.html"
  to = "/blog/finasteride-vs-dutasteride/"
  status = 301
  force = true

[[redirects]]
  from = "/amp/blog/how-to-track-minoxidil-progress"
  to = "/blog/how-to-track-minoxidil-progress/"
  status = 301
  force = true

[[redirects]]
  from = "/amp/blog/how-to-track-minoxidil-progress.html"
  to = "/blog/how-to-track-minoxidil-progress/"
  status = 301
  force = true

[[redirects]]
  from = "/amp/blog/understanding-the-norwood-scale"
  to = "/blog/understanding-norwood-scale/"
  status = 301
  force = true

[[redirects]]
  from = "/amp/blog/understanding-the-norwood-scale.html"
  to = "/blog/understanding-norwood-scale/"
  status = 301
  force = true

# Anything else that was ever published under /amp/.
[[redirects]]
  from = "/amp/*"
  to = "/blog/"
  status = 301
  force = true

name: Track Hair
tagline: Hair loss tracker app for men
description: Hair loss tracker app for men with treatment schedules, progress photos, and AI-guided Norwood stage check-ins.
full_description: Track Hair helps you stay consistent with hair loss treatment schedules, document progress with repeatable photos, and understand your routine over time.
app_store_url: https://apps.apple.com/id6740919537
android: false
web: false
logo: /assets/images/THAppIcon.png
screenshots:
  - 1.png
  - 2.png
  - 3.png
  - 4.png

hero:
  eyebrow: Hair loss tracker app
  title: Track treatments, photos, and progress in one place.
  description: Track Hair gives you a dedicated hair loss tracking workflow for finasteride, minoxidil, microneedling, transplant recovery, and long-term routine consistency.
  proof: Built for reminders, progress photos, and AI-assisted Norwood stage tracking.
  primary_cta: Download on the App Store
  secondary_cta_label: Explore treatment guides
  secondary_cta_url: /treatments/

story:
  title: The app mirrors the routine you already follow.
  intro: Designed like a focused treatment journal, not a generic habit app. Every screen is built around keeping a hair loss regimen consistent and measurable.
  steps:
    - title: Build a treatment plan
      description: Add finasteride, minoxidil, microneedling, ketoconazole, PRP, or your own regimen with custom timing and dose details.
    - title: Stay consistent every day
      description: Mark treatments complete, keep your routine visible, and use reminders that match real-world schedules.
    - title: Capture evidence over time
      description: Save progress photos, compare changes month to month, and review your hair loss journey with more context than memory alone.

features:
  - icon: Routine
    title: Treatment schedules
    description: Create a structured routine for daily, weekly, or post-procedure care without juggling separate reminder apps.
  - icon: Photos
    title: Progress photos
    description: Keep repeatable before-and-after photos in one timeline so changes are easier to judge over months.
  - icon: Notes
    title: Regimen details
    description: Store dose, frequency, and notes for each treatment so your routine stays documented and easy to review.
  - icon: AI
    title: Norwood tracking
    description: Use AI-assisted analysis as an extra reference point when monitoring visible change over time.
  - icon: Multi
    title: Multi-treatment support
    description: Track finasteride, minoxidil, transplant recovery, PRP, red light therapy, and more in the same plan.

regimens:
  - title: Finasteride and dutasteride
    description: Keep daily 5-alpha-reductase inhibitor schedules consistent and compare long-term results against baseline photos.

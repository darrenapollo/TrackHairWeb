hero:
  eyebrow: Hair loss tracker app for women and men
  title: Track your hair loss treatments, photos, and changes over months.
  description: Track Hair brings female and male hair loss routines, minoxidil, finasteride, spironolactone, transplant recovery, PRP, microneedling, progress photos, regimen notes, and review timelines together so you can judge change with more context.
  proof: Built for individual routines, long review windows, and treatment consistency. Not a generic habit tracker or one-off scanner.
  primary_cta: Download on the App Store
  secondary_cta_label: Build a better routine
  secondary_cta_url: /treatments/

story:
  title: Hair growth is a long game. Your hair loss tracker should be built for that.
  intro: Track Hair is designed like a treatment journal for your scalp, your plan, and your timeline. It helps you keep your hair loss routine stable enough to understand what is happening instead of guessing from memory.
  steps:
    - title: Build your individual plan
      description: Add minoxidil, finasteride, spironolactone, microneedling, ketoconazole, PRP, red light therapy, transplant recovery, or your own custom routine with timing and dose details.
    - title: Follow it without losing context
      description: Mark treatments complete, record missed days honestly, and keep the plan visible so changes in your routine do not disappear into memory.
    - title: Review your journey over months
      description: Save repeatable progress photos and notes so you can compare meaningful intervals, not emotional day-to-day mirror checks.

features:
  - icon: Routine
    title: A real treatment plan
    description: Create daily, weekly, session-based, or post-procedure schedules that reflect the routine you are actually following.
  - icon: Photos
    title: Repeatable progress photos
    description: Keep baseline and follow-up photos in one timeline so changes are easier to judge across months, not moods.
  - icon: Notes
    title: Regimen history
    description: Store dose, frequency, missed applications, shedding notes, side effects, and plan changes so every review has context.
  - icon: AI
    title: AI as a reference, not the product
    description: Use AI-assisted visible-change checks as one input alongside your photos, notes, and treatment history.
  - icon: Multi
    title: Multi-treatment planning
    description: Track minoxidil, finasteride, spironolactone, transplant recovery, PRP, red light therapy, microneedling, and custom routines in the same plan.


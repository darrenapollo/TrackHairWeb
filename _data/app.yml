name: Track Hair
tagline: Hair loss tracker app for women and men
description: Hair loss tracker app for women and men with treatment schedules, progress photos, regimen notes, and long-term review.
full_description: Track Hair helps women and men track a hair loss journey, stay consistent with treatment schedules, document progress with repeatable photos, and understand a routine over time.
app_store_url: https://apps.apple.com/app/id6740919537
android: false
web: false
logo: /assets/images/THAppIcon.png
screenshots:
  - file: 1.jpg
    alt: "Track Hair daily view showing the July calendar with finasteride, microneedling, and minoxidil marked complete for the day"
  - file: 2.jpg
    alt: "Treatment schedule listing microneedling, ketoconazole shampoo, minoxidil, finasteride, and a weekly progress photo reminder"
  - file: 3.jpg
    alt: "Editing a topical minoxidil treatment with dose, unit, frequency, and start date fields"
  - file: 4.jpg

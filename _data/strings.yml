  cta_title: Start treating your hair growth journey like a plan.
  cta_subtitle: Keep your treatments, progress photos, notes, and review timeline together from the first baseline photo onward.

  faq:
    - question: What is a hair loss tracker app?
      answer: A hair loss tracker app helps you organize treatments, keep photo records, and monitor visible changes over time. Track Hair goes further by turning your routine into a long-term plan with schedules, notes, photos, and review checkpoints.
    - question: Why track hair loss instead of relying on memory?
      answer: Hair loss treatments usually take months to judge. Consistent photos, treatment logs, missed-dose history, and notes make it easier to see what actually happened and discuss progress with a clinician.
    - question: Can I track minoxidil, finasteride, and spironolactone together?
      answer: Yes. Track Hair is designed for multi-treatment routines, so topical treatments, oral prescriptions, scalp stimulation, procedures, supplements, and custom routines can live in the same plan without becoming one messy note.
    - question: Can Track Hair be used for female pattern hair loss?
      answer: Yes. Track Hair can organize female hair loss routines such as minoxidil, spironolactone, supplements recommended for a deficiency, PRP, red light therapy, progress photos, and clinician review notes.
    - question: Does Track Hair diagnose hair loss?
      answer: No. Track Hair is a planning and tracking tool, not a diagnostic or treatment service. Any AI-assisted review should be treated as informational support alongside photos, notes, and clinician guidance.
    - question: What should I photograph when tracking progress?
      answer: Most people benefit from repeatable front, temple, crown, part-line, and top-down photos captured in similar lighting at planned intervals. The goal is a useful timeline, not daily self-checking.


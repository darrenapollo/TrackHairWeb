  faq:
    - question: What is a hair loss tracker app?
      answer: A hair loss tracker app helps you organize treatments, keep photo records, and monitor visible changes over time. Track Hair focuses specifically on male pattern baldness routines such as finasteride, minoxidil, microneedling, and transplant recovery.
    - question: Why track hair loss instead of relying on memory?
      answer: Hair loss treatments usually take months to judge. Consistent photos, treatment logs, and notes make it easier to spot change, stay consistent, and discuss progress with a clinician.
    - question: Can I track finasteride and minoxidil together?
      answer: Yes. Track Hair is designed for multi-treatment routines, so you can keep separate schedules and notes for oral medication, topical treatment, scalp stimulation, and procedure recovery in the same app.
    - question: Does Track Hair diagnose hair loss?
      answer: No. The app is a tracking tool, not a diagnostic or treatment service. Any AI analysis should be treated as informational support rather than medical advice.
    - question: What should I photograph when tracking progress?
      answer: Most people benefit from repeatable front, temple, crown, and top-down photos captured in similar lighting and at regular intervals.


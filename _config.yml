### Google webmaster tools, Google Analytics, Doorbell and Cookie consent uncomment and put the API key
# Analytics only loads in production after a visitor allows optional analytics.
# It includes privacy-safe App Store outbound-click tracking.
# Mark `app_store_click` as a key event in GA4 after validating it in DebugView.
# Prefer privacy-first analytics? Swap _includes/google-analytics.html for a
# Plausible/Fathom snippet — the same App Store click listener works with either.
google_analytics: "G-QNQD8FL3P2"
#doorbell:
#  id: doorbell_id
#  appKey: doorbell_appKey

cookie_consent: true

### Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - octopress-minify-html

### Default social share image for every page (jekyll-seo-tag reads page.image).
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.jpg

### Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - _src
  - _images
  - LICENSE
  - package.json
  - README.md
  - webpack.config.js
  - yarn-error.log
  - yarn.lock
  - config
  - optimization-fix
  - optimization-fix-this-file-is-ignored.js
  - icon.png
  - docs
